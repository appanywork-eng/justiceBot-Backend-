substitutions:
  _REGION: europe-west1
  _REPOSITORY: petitiondesk
  _IMAGE: petitiondesk-backend
  _SERVICE: petitiondesk-backend
  _GEMINI_MODEL: gemini-3.7-flash
  _PETITION_PRICE_NGN: '550'
  _FREE_ACCESS_ENABLED: 'true'
  _FREE_PETITION_LIMIT: '2'

steps:
  - id: build-container
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID'
      - .

  - id: push-container
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID'

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--concurrency=20'
      - '--timeout=300'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--update-env-vars=FIRESTORE_ENABLED=true,FRONTEND_BASE_URL=https://petitiondesk.com,GEMINI_MODEL=${_GEMINI_MODEL},PETITION_PRICE_NGN=${_PETITION_PRICE_NGN},FREE_ACCESS_ENABLED=${_FREE_ACCESS_ENABLED},FREE_PETITION_LIMIT=${_FREE_PETITION_LIMIT}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
